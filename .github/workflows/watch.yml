name: cruise-watch
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert to my phone"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cruise-watch
  cancel-in-progress: false
jobs:
  # Upload and deploy must be separate jobs. actions/deploy-pages lists artifacts
  # through the API, and an artifact uploaded in the still-running job is not
  # visible yet ("No artifacts named github-pages were found"). needs: watch
  # starts deploy only after that artifact is committed to the run.
  watch:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4          # remembers sent alerts and the last good deals list
        with:
          path: |
            seen.sqlite
            site/deals.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - run: python cruise_watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - if: ${{ inputs.test_alert }}
        run: python cruise_watch.py --test-notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - uses: actions/configure-pages@v5
        continue-on-error: true          # Pages not enabled yet: alerts still work
        id: pages
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        id: upload
        with:
          path: site
      - id: gate
        if: always()
        run: |
          pages="${{ steps.pages.outcome }}"
          upload="${{ steps.upload.outcome }}"
          if [ "$pages" = "success" ] && [ "$upload" = "success" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: watch
    if: needs.watch.result == 'success' && needs.watch.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
